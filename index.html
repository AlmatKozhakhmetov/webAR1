<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГРПШ AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; background-color: #f0f0f0; }
        .ar-button {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 14px 28px; background-color: #007bff; color: white;
            border: none; border-radius: 30px; font-size: 16px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 999;
        }
    </style>
</head>
<body>

    <model-viewer src="model.glb"
                  ar
                  ar-modes="webxr scene-viewer quick-look"
                  camera-controls
                  auto-rotate
                  shadow-intensity="1"
                  alt="3D модель ГРПШ">
        
        <button slot="ar-button" class="ar-button">Посмотреть в AR (На объекте)</button>
        
    </model-viewer>

</body>
</html>
