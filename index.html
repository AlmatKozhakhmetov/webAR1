<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Презентация ГРПШ в AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; background: #f8f9fa; }
        .ar-button {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 16px 32px; background: #28a745; color: white;
            border: none; border-radius: 50px; font-size: 16px; font-weight: bold;
            box-shadow: 0 4px 15px rgba(40,167,69,0.4); cursor: pointer; z-index: 999;
        }
        .hint {
            position: absolute; top: 15px; width: 100%; text-align: center;
            color: #555; font-size: 14px; z-index: 998;
        }
    </style>
</head>
<body>

    <div class="hint">Пальцем можно крутить и масштабировать ГРПШ</div>

    <model-viewer src="model.glb"
                  ar
                  ar-modes="scene-viewer quick-look webxr"
                  camera-controls
                  auto-rotate
                  ar-scale="fixed" 
                  shadow-intensity="1.5"
                  alt="3D модель ГРПШ">
        
        <button slot="ar-button" class="ar-button">🚀 ЗАПУСТИТЬ AR НА ОБЪЕКТЕ</button>
        
    </model-viewer>

</body>
</html>
