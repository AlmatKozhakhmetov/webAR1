<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГРПШ Настоящий WebAR</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        /* Красивый экран загрузки камеры */
        #scanning-overlay {
            position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: sans-serif; font-size: 18px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="scanning-overlay">
        <p>📷 Запуск AR-камеры...</p>
        <p style="font-size: 14px; color: #ccc;">Наведите на маркер, когда включится видео</p>
    </div>

    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/examples/image-tracking/assets/card-example/card.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights: true" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="grpshModel" src="model.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-entity gltf-model="#grpshModel" 
                      position="0 0 0" 
                      scale="0.2 0.2 0.2" 
                      rotation="90 0 0">
            </a-entity>
        </a-entity>
        
    </a-scene>

    <script>
        // Скрываем экран загрузки, как только камера включилась
        document.querySelector('a-scene').addEventListener("arReady", (event) => {
            document.getElementById('scanning-overlay').classList.add('hidden');
        });
    </script>
</body>
</html>
